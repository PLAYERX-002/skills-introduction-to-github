<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do what?</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            background: linear-gradient(
                to right,
                rgb(113,5,168),
                rgba(44,144,251,1)
            );
        }
        .homePage{
            width: 98%;
            height: 500px;
            background: #fff;
            border-radius: 5px;
            margin-top: 40px;
            margin-left: 1%;
        }
        .title{
            font-weight: 700;
            font-size: 30px;
            text-align:center;
            padding-top:20px ;
        }
        .addThings{
            display: flex;
            margin-top: 20px;
            margin-left: 30px;
            margin-bottom: 20px;
        }
        .addInput{
            border: 1px , solid , #dfefe5;
            outline: none;
            width: 60%;
            height: 50px;
            border-radius: 20px 0 0 20px;
            padding-left: 15px;
        }
        .addButton{
            width: 100px;
            height: 52px;
            border-radius: 0 20px 20px 0;
            text-align: center;
            font-size: 13px;
            background: linear-gradient(
                to right,
                rgb(113,65,168),
                rgba(44,144,251,1)
            );
            color: #fff;
            line-height: 52px;
            cursor: pointer;
            user-select: none;
        }
        .Things{
            display: flex;
            box-sizing: border-box;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            height: 50px;
            margin: 8px auto;
            padding: 16px;
            border-radius: 20px;
            box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 20px;
        }
        .deal{
            color: red;
        }
        .completed{
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>

</head>
<body>
    <div class="homePage">
        <div class="title">
            是啊，今天干什么？
        </div>

        <div class="addThings">

            <div class="addButton" >

            </div>

        </div>

</html>
